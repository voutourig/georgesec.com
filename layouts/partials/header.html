{{/* Site header: the ASCII GEORGESEC banner is the logo (large on the home page, compact elsewhere), nav menu under or beside it. */}}
<header class="header site-header {{ if .IsHome }}is-home{{ else }}is-inner{{ end }}">
  <div class="site-header__logo">
    <a class="banner-link" href="{{ site.Params.Logo.logoHomeLink | default "/" }}" aria-label="georgesec, home">{{ partial "banner.html" . }}</a>
  </div>
  <nav class="site-nav" aria-label="Main">
    <ul>
      {{ range site.Menus.main }}<li><a href="{{ .URL }}"{{ if and (not $.IsHome) (eq (strings.TrimSuffix "/" .URL) (strings.TrimSuffix "/" $.RelPermalink)) }} aria-current="page"{{ end }}>{{ .Name }}</a></li>{{ end }}
    </ul>
  </nav>
</header>
