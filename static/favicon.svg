<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="GV">
  <rect width="64" height="64" rx="10" fill="#0b0a10"/>
  <rect x="2.5" y="2.5" width="59" height="59" rx="8" fill="none" stroke="#b366ff" stroke-width="2.5"/>
  <!--
    Interlocking GV monogram inspired by Georgia Tech's GT mark.
    G = outer heavy letter open on the right.
    V = nested into that opening; left arm of V sits against the
    G crossbar so the two letters read as one mark.
    Colour: site purple #b366ff (banner-b).
  -->
  <g fill="#b366ff">
    <!-- G body -->
    <path d="
      M 33 11
      H 23.5
      C 13.5 11, 7.5 17.5, 7.5 27.5
      V 36.5
      C 7.5 46.5, 13.5 53, 23.5 53
      H 39.5
      V 44.5
      H 23.5
      C 18.2 44.5, 15.5 41.5, 15.5 36.5
      V 27.5
      C 15.5 22.5, 18.2 19.5, 23.5 19.5
      H 33
      Z
    "/>
    <!-- G crossbar, short so V can sit against / slightly over it -->
    <path d="M 26 30.5 H 38 V 38.5 H 26 Z"/>
    <!-- V nested into G opening -->
    <path d="
      M 28.5 21
      L 36.8 50
      H 43.2
      L 54.5 21
      H 47
      L 40 42.5
      L 36.2 21
      Z
    "/>
  </g>
</svg>
